# Here you can define all your datasets by using simple YAML syntax.
#
# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/data/data_catalog.html

# =============================================================================
# Parametros Globais
# =============================================================================
_common_environment: &environment_default
  environment: prd

_sql_common: &sql_common
  type: factory.datasets.AppendSQLDataset
  credentials: db_credentials
  batch_size: 500
  <<: *environment_default

# =============================================================================
# 00 - Governance
# =============================================================================

pipeline_logs:
  <<: *sql_common
  table_name: governance.pipeline_logs
  pk_columns: [run_id, entity_name]

validation_data_mercado:
  <<: *sql_common
  table_name: governance.validation_data_mercado
  pk_columns: [cod_indice, dat_ref]

validation_data_indicadores:
  <<: *sql_common
  table_name: governance.validation_data_indicadores
  pk_columns: [indicator, score_col, dat_ref]

validation_indice_isbm:
