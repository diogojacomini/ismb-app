  pk_columns: [metrics_id]

metrics_stage_valorinveste:
  <<: *sql_common
  table_name: governance.metrics_stage_valorinveste
  pk_columns: [metrics_id]

metrics_stage_seudinheiro:
  <<: *sql_common
