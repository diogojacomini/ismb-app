# This is a boilerplate parameters config generated for pipeline 'data_quality'
# using Kedro 0.19.14.
#
# Documentation for this file format can be found in "Parameters"
# Link: https://docs.kedro.org/en/0.19.14/configuration/parameters.html
dataset_name_cds: "stage_cds"

quality_thresholds:
  completeness_min: 95.0  # percentage mínima de dados não nulos
  validity_min: 90.0      # percentage mínima de dados válidos
  consistency_min: 95.0   # percentage mínima de consistência
  outlier_max_pct: 5.0    # percentage máxima de outliers permitidos
