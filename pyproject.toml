[project]
name = "ismb"
version = "4.0.0"
description = "Indice de Sentimento do Mercado Brasileiro"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312" 

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy-overrides]]
module = [
    "confluent_kafka.*",
    "pyspark.*",
    "nltk.*",
    "great_expectations.*",
    "yfinance.*",
    "delta.*",
    "minio.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v"
]

markers = [
    "unit: testes unitários rápidos sem I/0",
    "integration: testes com serviços reais (Kafka, Redis, MinIO)",
    "e2e: testes end-to-end com Docker Compose completo",
    "slow: testes que demoram mais de 5s",
]
